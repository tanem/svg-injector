name: CI

on:
  push:
    branches: [master, 'v*']
  pull_request:
    branches: [master, 'v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx --no-install playwright install --with-deps
      - run: npm run test:coverage
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report
      # build-examples.js packs the library and installs the tarball into each
      # example, so this is the end-to-end check that the published artefact
      # resolves and runs through a real bundler.
      - run: npm run build:examples
      - run: npm run test:examples:playwright
      - name: Upload examples Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-examples
          path: playwright-report-examples
          if-no-files-found: ignore
      - uses: codecov/codecov-action@v5
        with:
          # The action defaults this to false, which turned a dead coverage
          # pipeline into a green build.
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
